name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-26.04
            python: '3.13.18'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Check dependency consistency
        run: python -m pip check
      # pytest's pythonpath in pyproject.toml loads src/ directly; no unpinned build tools are needed.
      - name: Run Python tests
        run: python -m pytest -q

  deploy-scripts:
    name: Server installation and smoke test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-26.04
            python: '3.13.18'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up build runtimes
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Lint shell scripts
        run: shellcheck -x deploy/*.sh .github/scripts/check-server.sh
      - name: Prepare disposable Ubuntu host
        run: |
          # Hosted images share /opt with the runner. Model a dedicated server's
          # root-controlled /opt without changing permissions on the hosted tool cache.
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx sqlite3
      - name: Install Ubuntu 24.04 app interpreter
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get install -y --no-install-recommends python3.12-venv
      - name: Build the pinned CPython for the Vivobook
        if: matrix.os == 'ubuntu-26.04'
        run: bash deploy/install-python.sh
      - name: Build a release, start the service and check access
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT env PATH="$PATH" bash .github/scripts/check-server.sh '${{ matrix.python }}'

  frontend:
    name: Node 24 tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

# Optional /etc/modprobe.d/70-wifi-location-rtw89.conf for detected Realtek RTL8852BE / 8852BE-VT.
# Turns off the card's power-saving modes, which cause dropped connections on some laptops.
# If connections still drop, add disable_clkreq=y to the rtw89_pci line and reboot.
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y
options rtw89_core disable_ps_mode=y

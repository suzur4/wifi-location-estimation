# Managed by deploy/setup-server.sh.
# Keep the public API allowlist in sync with the student directory (including display mode).
server {
    listen __LAN_IP__:8080 default_server;
    server_name _;
    return 444;
}
server {
    listen __LAN_IP__:8080;
    server_name __LAN_IP__;
    allow __LAN_CIDR__;
    deny all;
    access_log off;
    client_max_body_size 32k;

    location ~ ^/(?:$|index\.html$|api/(?:teachers|areas|config)$|assets/[a-zA-Z0-9_-]+\.(?:css|js)$) {
        limit_except GET { deny all; }
        # Forward only the allowlisted, normalized path; discard credentials and query strings.
        proxy_pass http://127.0.0.1:8000$uri;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location / { return 403; }
}

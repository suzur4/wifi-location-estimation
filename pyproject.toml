[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "subaru-wifi-location"
version = "0.1.0"
description = "Reproducible, simulation-only school PC area estimation research prototype"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "numpy>=2.1,<3",
  "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
wifi-experiment = "wifi_location.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
